[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-multi-agent"
version = "0.1.0"
description = "ADK multi-agent finance ops system: AR, cash app, contracts, GraphRAG, governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.12.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["finance_ops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
