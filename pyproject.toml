[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-multi-agent"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.12.0",
  "PyYAML>=6.0.0",
  "python-dotenv>=1.0.0",
  "duckdb>=1.0.0",
  "playwright>=1.40.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-playwright>=0.4.0"]

[tool.setuptools.packages.find]
include = ["finance_ops*", "data_plane*", "pipelines*", "gui_connectors*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
