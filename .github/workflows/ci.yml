name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Browser binary required by tests/test_gui_connector.py (playwright package alone is not enough).
          python -m playwright install --with-deps chromium
      - name: Pytest
        run: PYTHONPATH=. pytest -q
      - name: Trajectory dry-run (RBAC / no-silent-apply regression)
        run: PYTHONPATH=. python evals/run_trajectory_eval.py --dry-run --min-pass-rate 0.8
      - name: Copilot scoreboard
        run: >
          PYTHONPATH=. python evals/copilot/run_scoreboard.py
          --write-results
          --min-citation 0.95
          --max-harmful 0.02
